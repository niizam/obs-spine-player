name: Build Plugin Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo
  OBS_PLUGIN_TEMPLATE_REF: 3e7d7ac3b5342cd7d9b88890b9c70b472d1520fc

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out plugin
        uses: actions/checkout@v6

      - name: Check out OBS plugin build support
        uses: actions/checkout@v6
        with:
          repository: obsproject/obs-plugintemplate
          ref: ${{ env.OBS_PLUGIN_TEMPLATE_REF }}
          path: _obs_plugin_template

      - name: Read plugin version
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\(obs-spine-player VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $match) {
            throw 'Could not read the plugin version from CMakeLists.txt'
          }

          "PLUGIN_VERSION=$($match.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S .github/ci `
            -B build-ci `
            -G "Visual Studio 17 2022" `
            -A "x64,version=10.0.22621" `
            -DOBS_PLUGIN_TEMPLATE_DIR="$env:GITHUB_WORKSPACE/_obs_plugin_template" `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build-ci --config "${{ env.BUILD_TYPE }}" --parallel

      - name: Install
        run: cmake --install build-ci --config "${{ env.BUILD_TYPE }}" --prefix package

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath obs-spine-player-windows-x64.zip

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
            $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup compiler was not found on the runner'
          }

          & $compiler `
            "/DAppVersion=$env:PLUGIN_VERSION" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\package" `
            "/DOutputDir=$env:GITHUB_WORKSPACE" `
            .github/installer/obs-spine-player.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: obs-spine-player-windows-x64
          path: |
            obs-spine-player-windows-x64.zip
            obs-spine-player-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
